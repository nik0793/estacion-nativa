name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'imagenes/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar la carpeta publicable (web + imágenes)
        run: |
          mkdir -p web/img/dispositivos web/img/renders
          cp -r imagenes/dispositivos/. web/img/dispositivos/
          if [ -d imagenes/renders ]; then cp -r imagenes/renders/. web/img/renders/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
